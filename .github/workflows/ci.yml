name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc python3 curl unzip
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - name: Dump Minecraft server registries
        run: |
          mkdir -p notchian
          cd notchian
          curl -Lo server.jar https://piston-data.mojang.com/v1/objects/6bce4ef400e4efaa63a13d5e6f6b500be969ef81/server.jar
          echo "eula=true" > eula.txt
          java -DbundlerMainClass="net.minecraft.data.Main" -jar server.jar --all
      - name: Generate registry headers
        run: bun run build_registries.js
      - name: Build server
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -Wpedantic -Iinclude src/*.c -o build/bareiron -lm
      - name: Unit tests
        run: |
          cd tests
          make SANITIZE=1 unit
      - name: Integration tests
        run: tests/run_integration.sh
